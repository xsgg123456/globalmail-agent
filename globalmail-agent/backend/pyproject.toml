[project]
name = "globalmail-agent-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.3",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "pypdf==6.19.0",
  "openai==3.26.0",
  "pgvector==0.5.0",
]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["src"]
